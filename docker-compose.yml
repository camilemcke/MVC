services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-1:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: app
      INSTANCE_NAME: backend-1
    depends_on:
      db:
        condition: service_healthy

  backend-2:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: app
      INSTANCE_NAME: backend-2
    depends_on:
      db:
        condition: service_healthy

  load-balancer:
    build: ./load-balancer
    restart: unless-stopped
    depends_on:
      - backend-1
      - backend-2

  inventory:
    build: ./inventory
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: app
    depends_on:
      db:
        condition: service_healthy

  analytics:
    build: ./analytics
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: app
    depends_on:
      db:
        condition: service_healthy

  middleware:
    build: ./middleware
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      - load-balancer
      - inventory
      - analytics

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - middleware

volumes:
  db_data:
