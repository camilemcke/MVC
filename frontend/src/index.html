<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Beauty Source | Inventario</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <h1>Beauty Source</h1>
    <p>Inventory Intelligence</p>
  </header>

  <main>
    <section class="dashboard">
  <div class="metric-card">
    <span>Productos</span>
    <strong id="total-products">-</strong>
  </div>

  <div class="metric-card">
    <span>Unidades en inventario</span>
    <strong id="total-stock">-</strong>
  </div>

  <div class="metric-card">
    <span>Stock bajo</span>
    <strong id="low-stock">-</strong>
  </div>
</section>
    <section class="search-section">
      <h2>Consulta de productos</h2>
      <p>Busca un producto por su ID.</p>

      <form id="product-form">
        <input
          type="number"
          id="product-id"
          placeholder="ID del producto"
          value="1"
          min="1"
          required
        />
        <button type="submit">Buscar producto</button>
      </form>
    </section>

    <section class="result-section">
      <div id="result"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
