events {}

http {
    upstream products {
        server backend-1:8080;
        server backend-2:8080;
    }

    server {
        listen 8000;

        add_header Access-Control-Allow-Origin "*" always;

        location /product {
            proxy_pass http://products;
        }

        location /inventory {
            proxy_pass http://inventory:8080;
        }

        location /analytics {
            proxy_pass http://analytics:8080;
        }

        location /heartbeat {
            return 200 "nginx gateway alive";
        }
    }
}
